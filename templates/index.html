<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVHelper Web Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79b8ff;
            --green: #3fb950;
            --orange: #d29922;
            --red: #f85149;
            --radius: 8px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
        }
        .header h1 { font-size: 17px; font-weight: 600; color: var(--accent); white-space: nowrap; }
        .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .header-controls label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
        .model-select {
            background: var(--surface2); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 5px 8px; font-size: 12px; cursor: pointer; min-width: 120px;
        }
        .model-select:focus { outline: none; border-color: var(--accent); }
        .lock-btn {
            background: var(--surface2); color: var(--text-dim);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 5px 8px; font-size: 13px; cursor: pointer; transition: all 0.15s;
        }
        .lock-btn:hover { border-color: var(--accent); color: var(--text); }
        .lock-btn.locked { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* Status bar */
        .status-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 11px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .status-dot.ok { background: var(--green); }
        .status-dot.err { background: var(--red); }

        /* Sliders */
        .slider-group { display: flex; align-items: center; gap: 6px; }
        .slider-group label { font-size: 11px; }
        .slider-group input[type="range"] {
            width: 60px; height: 4px;
            -webkit-appearance: none; appearance: none;
            background: var(--border); border-radius: 2px; outline: none;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--accent); cursor: pointer;
        }
        .slider-value { font-size: 11px; color: var(--text-dim); min-width: 24px; text-align: center; }

        /* K control */
        .k-control { display: flex; align-items: center; gap: 4px; }
        .k-control label { font-size: 11px; }
        .k-control input {
            width: 40px; background: var(--surface2); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 3px 6px; font-size: 12px; text-align: center;
        }

        /* Chat */
        .chat-container {
            flex: 1; overflow-y: auto; padding: 16px 20px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .chat-container::-webkit-scrollbar { width: 8px; }
        .chat-container::-webkit-scrollbar-track { background: var(--bg); }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .message { max-width: 82%; padding: 10px 14px; border-radius: var(--radius); line-height: 1.5; font-size: 14px; word-wrap: break-word; }
        .message.user {
            background: var(--accent); color: #fff; align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: var(--surface); border: 1px solid var(--border);
            align-self: flex-start; border-bottom-left-radius: 4px;
        }
        .message.assistant p { margin-bottom: 6px; }
        .message.assistant p:last-child { margin-bottom: 0; }
        .message.assistant pre {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 10px; overflow-x: auto;
            font-size: 13px; margin: 6px 0;
        }
        .message.assistant code { background: var(--surface2); padding: 1px 5px; border-radius: 3px; font-size: 13px; }
        .message.assistant pre code { background: none; padding: 0; }
        .message.assistant ul, .message.assistant ol { padding-left: 20px; margin: 6px 0; }
        .message.assistant blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--text-dim); margin: 6px 0; }
        .message.assistant table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
        .message.assistant th, .message.assistant td { border: 1px solid var(--border); padding: 4px 8px; }
        .message.assistant th { background: var(--surface2); }

        .msg-footer {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border);
        }
        .msg-meta { font-size: 11px; color: var(--text-dim); }
        .copy-btn {
            background: none; border: 1px solid var(--border); border-radius: 4px;
            color: var(--text-dim); font-size: 12px; padding: 2px 8px; cursor: pointer;
            transition: all 0.15s;
        }
        .copy-btn:hover { border-color: var(--accent); color: var(--text); }
        .copy-btn.copied { border-color: var(--green); color: var(--green); }

        /* Sources block */
        .sources-block {
            align-self: flex-start; max-width: 100%;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 8px 12px; font-size: 13px;
        }
        .sources-header { font-weight: 600; color: var(--orange); margin-bottom: 6px; font-size: 12px; }
        .source-item {
            display: flex; align-items: center; gap: 8px;
            padding: 3px 0; cursor: pointer;
            border-bottom: 1px solid transparent;
            transition: background 0.1s;
        }
        .source-item:hover { background: var(--surface); border-radius: 4px; }
        .source-score {
            font-size: 10px; padding: 1px 5px; border-radius: 8px;
            background: var(--bg); flex-shrink: 0;
        }
        .source-name { color: var(--accent); font-weight: 500; }
        .source-preview {
            display: none; margin-top: 4px; padding: 6px 8px;
            background: var(--bg); border-radius: 4px;
            font-size: 12px; color: var(--text-dim); line-height: 1.4;
            max-height: 100px; overflow-y: auto; white-space: pre-wrap;
        }
        .source-item.open .source-preview { display: block; }

        .message.system {
            background: transparent; color: var(--text-dim);
            align-self: center; font-size: 12px; font-style: italic;
        }

        .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
        .typing-indicator span {
            width: 7px; height: 7px; background: var(--text-dim);
            border-radius: 50%; animation: bounce 1.4s ease-in-out infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-7px); } }

        /* Input */
        .input-container {
            background: var(--surface); border-top: 1px solid var(--border);
            padding: 10px 20px; display: flex; gap: 8px;
            align-items: center; flex-shrink: 0;
        }
        .input-container textarea {
            flex: 1; background: var(--surface2); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 8px 12px; font-size: 14px; font-family: var(--font);
            resize: none; min-height: 38px; max-height: 100px; outline: none;
        }
        .input-container textarea:focus { border-color: var(--accent); }
        .input-container textarea::placeholder { color: var(--text-dim); }
        .btn {
            background: var(--accent); color: #fff; border: none;
            border-radius: var(--radius); padding: 8px 16px; font-size: 13px;
            font-weight: 500; cursor: pointer; transition: background 0.2s; white-space: nowrap;
        }
        .btn:hover:not(:disabled) { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: var(--red); }
        .btn-danger:hover:not(:disabled) { background: #f55; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }

        /* Empty state */
        .empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--text-dim); text-align: center; gap: 10px;
        }
        .empty-state h2 { font-size: 18px; color: var(--text); }
        .empty-state p { font-size: 13px; max-width: 400px; }

        @media (max-width: 700px) {
            .message { max-width: 95%; }
            .header { flex-direction: column; align-items: stretch; }
            .header-controls { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📄 TVHelper Web Agent</h1>
        <div class="header-controls">
            <div class="k-control">
                <label for="k-input">K:</label>
                <input type="number" id="k-input" value="5" min="1" max="20">
            </div>
            <div class="slider-group">
                <label for="temp-slider">temp</label>
                <input type="range" id="temp-slider" min="0" max="10" value="3">
                <span class="slider-value" id="temp-val">0.3</span>
            </div>
            <div class="slider-group">
                <label for="tokens-slider">токенов</label>
                <input type="range" id="tokens-slider" min="256" max="4096" step="128" value="2048">
                <span class="slider-value" id="tokens-val">2048</span>
            </div>
            <label for="model-select">Модель:</label>
            <select id="model-select" class="model-select"><option>Загрузка...</option></select>
            <button id="lock-btn" class="lock-btn" title="Зафиксировать модель">🔒</button>
            <div class="status-bar" id="status-bar">
                <span class="status-item" id="gpu-status"><span class="status-dot err"></span>GPU</span>
                <span class="status-item" id="ollama-status"><span class="status-dot err"></span>Ollama</span>
                <span class="status-item" id="search-status"><span class="status-dot err"></span>Search</span>
            </div>
            <button id="export-btn" class="btn btn-sm" title="Экспорт диалога">📥</button>
        </div>
    </div>

    <div class="chat-container" id="chat">
        <div class="empty-state">
            <h2>Задайте вопрос по документации</h2>
            <p>Я ищу ответы в базе знаний SDE Search и использую локальную LLM для формирования ответа с указанием источников.</p>
        </div>
    </div>

    <div class="input-container">
        <textarea id="question-input" rows="1" placeholder="Введите ваш вопрос..." autofocus></textarea>
        <button id="send-btn" class="btn">➤ Отправить</button>
        <button id="cancel-btn" class="btn btn-danger" style="display:none;">✕</button>
    </div>

    <script>
        // === DOM refs ===
        const chat = document.getElementById('chat');
        const input = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const modelSelect = document.getElementById('model-select');
        const kInput = document.getElementById('k-input');
        const lockBtn = document.getElementById('lock-btn');
        const exportBtn = document.getElementById('export-btn');
        const tempSlider = document.getElementById('temp-slider');
        const tempVal = document.getElementById('temp-val');
        const tokensSlider = document.getElementById('tokens-slider');
        const tokensVal = document.getElementById('tokens-val');

        let abortController = null;
        let currentModel = '';
        let modelsList = [];
        let modelLocked = false;
        let history = []; // {role, content, sources?, metrics?}

        // === Sliders ===
        tempSlider.addEventListener('input', () => {
            tempVal.textContent = (parseInt(tempSlider.value) / 10).toFixed(1);
        });
        tokensSlider.addEventListener('input', () => {
            tokensVal.textContent = tokensSlider.value;
        });

        // === Auto-resize textarea ===
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 100) + 'px';
        });

        // === Chat history (localStorage) ===
        const STORAGE_KEY = 'tvhelper_chat_history';

        function saveHistory() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            } catch(e) { /* quota exceeded — ignore */ }
        }

        function loadHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    history = JSON.parse(raw);
                    if (!Array.isArray(history)) history = [];
                }
            } catch(e) { history = []; }
        }

        function renderHistory() {
            const empty = chat.querySelector('.empty-state');
            if (empty) empty.remove();
            chat.innerHTML = '';
            history.forEach(msg => {
                if (msg.role === 'user') {
                    addMessage('user', msg.content);
                } else if (msg.role === 'assistant') {
                    addAssistantMessage(msg.content, msg.sources || [], msg.metrics || null);
                } else if (msg.role === 'system') {
                    addMessage('system', msg.content);
                }
            });
        }

        // === Load models ===
        async function loadModels() {
            try {
                const resp = await fetch('/api/models');
                const data = await resp.json();
                modelsList = data.models || [];
                const prevModel = modelLocked ? currentModel : modelSelect.value;
                modelSelect.innerHTML = '';
                modelsList.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.name;
                    opt.textContent = m.name + ' (' + formatSize(m.size) + ')';
                    modelSelect.appendChild(opt);
                });
                if (prevModel && modelsList.find(m => m.name === prevModel)) {
                    modelSelect.value = prevModel;
                } else if (data.default && modelsList.find(m => m.name === data.default)) {
                    modelSelect.value = data.default;
                } else if (modelsList.length > 0) {
                    modelSelect.value = modelsList[0].name;
                }
                currentModel = modelSelect.value;
            } catch(e) { /* ignore */ }
        }

        function formatSize(bytes) {
            if (!bytes) return '?';
            const gb = bytes / (1024**3);
            return gb >= 1 ? gb.toFixed(1) + 'GB' : (bytes / (1024**2)).toFixed(0) + 'MB';
        }

        modelSelect.addEventListener('change', () => {
            if (modelLocked) {
                modelLocked = false;
                lockBtn.classList.remove('locked');
                lockBtn.textContent = '🔒';
            }
            currentModel = modelSelect.value;
        });

        lockBtn.addEventListener('click', () => {
            modelLocked = !modelLocked;
            lockBtn.classList.toggle('locked', modelLocked);
            lockBtn.textContent = modelLocked ? '🔓' : '🔒';
            lockBtn.title = modelLocked ? 'Разблокировать модель' : 'Зафиксировать модель';
        });

        // === System status ===
        async function refreshStatus() {
            try {
                const resp = await fetch('/api/status');
                const s = await resp.json();
                updateStatusItem('gpu-status', s.gpu && s.gpu.used_mb != null,
                    s.gpu ? `${(s.gpu.used_mb/1024).toFixed(1)}/${(s.gpu.total_mb/1024).toFixed(1)}GB ${s.gpu.util_pct}%` : '—');
                updateStatusItem('ollama-status', s.ollama, 'Ollama');
                updateStatusItem('search-status', s.search, 'Search');
            } catch(e) { /* ignore */ }
        }

        function updateStatusItem(id, ok, label) {
            const el = document.getElementById(id);
            if (!el) return;
            const dot = el.querySelector('.status-dot');
            dot.className = 'status-dot ' + (ok ? 'ok' : 'err');
            el.title = label;
        }

        // === Chat functions ===
        function addMessage(role, content) {
            const empty = chat.querySelector('.empty-state');
            if (empty) empty.remove();
            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = content;
            chat.appendChild(div);
            scrollToBottom();
            return div;
        }

        function addAssistantMessage(content, sources, metrics) {
            const empty = chat.querySelector('.empty-state');
            if (empty) empty.remove();

            const wrapper = document.createElement('div');
            wrapper.className = 'message assistant';

            // Rendered markdown
            const body = document.createElement('div');
            try {
                body.innerHTML = marked.parse(content);
            } catch(e) {
                body.textContent = content;
            }
            wrapper.appendChild(body);

            // Footer: metrics + copy
            const footer = document.createElement('div');
            footer.className = 'msg-footer';
            const meta = document.createElement('span');
            meta.className = 'msg-meta';
            if (metrics) {
                const tps = metrics.eval_duration > 0
                    ? (metrics.eval_count / (metrics.eval_duration / 1e9)).toFixed(1)
                    : '?';
                meta.textContent = `⚡ ${metrics.eval_count} токенов • ${tps} т/с`;
            }
            footer.appendChild(meta);

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.textContent = '📋 Копировать';
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(content).then(() => {
                    copyBtn.textContent = '✅ Скопировано';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = '📋 Копировать';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                });
            });
            footer.appendChild(copyBtn);
            wrapper.appendChild(footer);

            chat.appendChild(wrapper);

            // Sources block
            if (sources && sources.length > 0) {
                addSourcesBlock(sources);
            }

            scrollToBottom();
            return wrapper;
        }

        function addSourcesBlock(sources) {
            const div = document.createElement('div');
            div.className = 'sources-block';
            div.innerHTML = '<div class="sources-header">📚 Источники (нажмите для просмотра)</div>';
            sources.forEach(s => {
                const item = document.createElement('div');
                item.className = 'source-item';
                const snippet = s.snippet ? escHtml(s.snippet.slice(0, 300)) : '';
                item.innerHTML = `
                    <span class="source-score">${s.score.toFixed(3)}</span>
                    <span class="source-name">${escHtml(s.source)}</span>
                    <span style="color:var(--text-dim);font-size:11px;">${escHtml(s.product)}</span>
                    <div class="source-preview">${snippet}</div>
                `;
                item.addEventListener('click', () => {
                    item.classList.toggle('open');
                });
                div.appendChild(item);
            });
            chat.appendChild(div);
            scrollToBottom();
        }

        function addThinking() {
            const empty = chat.querySelector('.empty-state');
            if (empty) empty.remove();
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'thinking-msg';
            div.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            chat.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }

        function escHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // === Send question ===
        async function sendQuestion() {
            const question = input.value.trim();
            if (!question) return;

            sendBtn.disabled = true;
            sendBtn.style.display = 'none';
            cancelBtn.style.display = 'inline-block';
            cancelBtn.disabled = false;
            input.disabled = true;

            // Add user message to UI + history
            addMessage('user', question);
            history.push({role: 'user', content: question});
            saveHistory();

            input.value = '';
            input.style.height = 'auto';

            const thinkingEl = addThinking();
            const k = parseInt(kInput.value) || 5;
            const temperature = parseInt(tempSlider.value) / 10;
            const numPredict = parseInt(tokensSlider.value);

            // Build history for context (last 10 turns)
            const historyMsgs = [];
            for (let i = Math.max(0, history.length - 20); i < history.length - 1; i++) {
                const m = history[i];
                if (m.role === 'user' || m.role === 'assistant') {
                    historyMsgs.push({role: m.role, content: m.content});
                }
            }

            try {
                abortController = new AbortController();
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        model: currentModel,
                        k: k,
                        temperature: temperature,
                        num_predict: numPredict,
                        history: historyMsgs,
                    }),
                    signal: abortController.signal,
                });

                if (!resp.ok) throw new Error('HTTP ' + resp.status);

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let responseText = '';
                let sources = [];
                let metrics = null;
                let sourcesReceived = false;

                thinkingEl.remove();

                const msgDiv = document.createElement('div');
                msgDiv.className = 'message assistant';

                // We'll build content progressively
                const bodyDiv = document.createElement('div');
                msgDiv.appendChild(bodyDiv);

                // Footer placeholder
                const footer = document.createElement('div');
                footer.className = 'msg-footer';
                const meta = document.createElement('span');
                meta.className = 'msg-meta';
                footer.appendChild(meta);

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = '📋 Копировать';
                footer.appendChild(copyBtn);

                chat.appendChild(msgDiv);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const event = JSON.parse(line.slice(6));
                            if (event.type === 'sources' && !sourcesReceived) {
                                sourcesReceived = true;
                                sources = event.data || [];
                                addSourcesBlock(sources);
                            } else if (event.type === 'token') {
                                responseText += event.data;
                                bodyDiv.innerHTML = marked.parse(responseText);
                                scrollToBottom();
                            } else if (event.type === 'done') {
                                metrics = event.data;
                                const tps = metrics.eval_duration > 0
                                    ? (metrics.eval_count / (metrics.eval_duration / 1e9)).toFixed(1)
                                    : '?';
                                meta.textContent = `⚡ ${metrics.eval_count} токенов • ${tps} т/с`;
                                copyBtn.addEventListener('click', () => {
                                    navigator.clipboard.writeText(responseText).then(() => {
                                        copyBtn.textContent = '✅ Скопировано';
                                        copyBtn.classList.add('copied');
                                        setTimeout(() => {
                                            copyBtn.textContent = '📋 Копировать';
                                            copyBtn.classList.remove('copied');
                                        }, 2000);
                                    });
                                });
                                msgDiv.appendChild(footer);
                            } else if (event.type === 'error') {
                                responseText += '\n\n[Ошибка: ' + event.data + ']';
                                bodyDiv.innerHTML = marked.parse(responseText);
                                scrollToBottom();
                            }
                        } catch(e) { /* partial line */ }
                    }
                }

                // Save to history
                history.push({role: 'assistant', content: responseText, sources: sources, metrics: metrics});
                saveHistory();

            } catch (e) {
                if (e.name === 'AbortError') {
                    addMessage('system', '⏹ Ответ прерван');
                    history.push({role: 'system', content: '⏹ Ответ прерван'});
                } else {
                    console.error(e);
                    thinkingEl.remove();
                    addMessage('system', '❌ Ошибка: ' + e.message);
                    history.push({role: 'system', content: '❌ Ошибка: ' + e.message});
                }
                saveHistory();
            } finally {
                sendBtn.disabled = false;
                sendBtn.style.display = 'inline-block';
                cancelBtn.style.display = 'none';
                input.disabled = false;
                input.focus();
                abortController = null;
            }
        }

        // === Cancel ===
        cancelBtn.addEventListener('click', () => {
            if (abortController) { abortController.abort(); abortController = null; }
        });

        // === Enter to send ===
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuestion();
            }
        });
        sendBtn.addEventListener('click', sendQuestion);

        // === Export dialog ===
        exportBtn.addEventListener('click', () => {
            let text = '# TVHelper Web Agent — Диалог\n\n';
            history.forEach(m => {
                if (m.role === 'user') text += `## Пользователь\n${m.content}\n\n`;
                else if (m.role === 'assistant') text += `## Ассистент\n${m.content}\n\n`;
                else text += `## ${m.role}\n${m.content}\n\n`;
            });
            const blob = new Blob([text], {type: 'text/markdown'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'tvhelper-dialog.md';
            a.click();
            URL.revokeObjectURL(url);
        });

        // === Clear chat (double-click header) ===
        document.querySelector('.header h1').addEventListener('dblclick', () => {
            if (confirm('Очистить историю чата?')) {
                history = [];
                saveHistory();
                chat.innerHTML = '<div class="empty-state"><h2>Задайте вопрос по документации</h2><p>Я ищу ответы в базе знаний SDE Search...</p></div>';
            }
        });

        // === Init ===
        loadHistory();
        renderHistory();
        loadModels();
        refreshStatus();
        setInterval(loadModels, 30000);
        setInterval(refreshStatus, 10000);
    </script>
</body>
</html>
