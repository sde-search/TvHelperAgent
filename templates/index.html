<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVHelper Web Agent</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79b8ff;
            --green: #3fb950;
            --orange: #d29922;
            --red: #f85149;
            --radius: 8px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-controls label {
            font-size: 13px;
            color: var(--text-dim);
        }

        .model-select {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            min-width: 140px;
        }

        .model-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
        }

        .status-ok { color: var(--green); }
        .status-error { color: var(--red); }

        .k-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .k-control label { font-size: 13px; }
        .k-control input {
            width: 48px;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px 8px;
            font-size: 13px;
            text-align: center;
        }

        /* Chat area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: var(--bg);
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--radius);
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            background: var(--accent);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: var(--surface);
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.assistant p { margin-bottom: 8px; }
        .message.assistant p:last-child { margin-bottom: 0; }

        .message.sources {
            background: var(--surface2);
            border: 1px solid var(--border);
            align-self: flex-start;
            font-size: 13px;
            color: var(--text-dim);
            border-bottom-left-radius: 4px;
            max-width: 100%;
        }

        .message.sources .source-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
        }

        .message.sources .source-item:last-child {
            border-bottom: none;
        }

        .source-score {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            background: var(--bg);
            flex-shrink: 0;
        }

        .source-name {
            color: var(--accent);
            font-weight: 500;
        }

        .message.system {
            background: transparent;
            color: var(--text-dim);
            align-self: center;
            font-size: 12px;
            font-style: italic;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        /* Input area */
        .input-container {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .input-container textarea {
            flex: 1;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-size: 14px;
            font-family: var(--font);
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
        }

        .input-container textarea:focus {
            border-color: var(--accent);
        }

        .input-container textarea::placeholder {
            color: var(--text-dim);
        }

        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-danger {
            background: var(--red);
        }

        .btn-danger:hover:not(:disabled) {
            background: #f55;
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            text-align: center;
            gap: 12px;
        }

        .empty-state h2 {
            font-size: 20px;
            color: var(--text);
        }

        .empty-state p {
            font-size: 14px;
            max-width: 400px;
        }

        /* Markdown-like formatting */
        .message.assistant strong { color: var(--accent); }
        .message.assistant code {
            background: var(--surface2);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 13px;
        }
        .message.assistant .citation {
            color: var(--green);
            font-size: 12px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .message { max-width: 95%; }
            .header { flex-direction: column; gap: 8px; }
            .header-controls { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📄 TVHelper Web Agent</h1>
        <div class="header-controls">
            <div class="k-control">
                <label for="k-input">Чанков:</label>
                <input type="number" id="k-input" value="5" min="1" max="20">
            </div>
            <label for="model-select">Модель:</label>
            <select id="model-select" class="model-select">
                <option value="">Загрузка...</option>
            </select>
            <span id="status-badge" class="status-badge status-ok">✓ ОК</span>
        </div>
    </div>

    <div class="chat-container" id="chat">
        <div class="empty-state">
            <h2>Задайте вопрос по документации</h2>
            <p>Я ищу ответы в базе знаний SDE Search и использую локальную LLM для формирования ответа с указанием источников.</p>
        </div>
    </div>

    <div class="input-container">
        <textarea id="question-input" rows="1" placeholder="Введите ваш вопрос..." 
            autofocus></textarea>
        <button id="send-btn" class="btn">➤ Отправить</button>
        <button id="cancel-btn" class="btn btn-danger" style="display:none;">✕</button>
    </div>

    <script>
        // === DOM refs ===
        const chat = document.getElementById('chat');
        const input = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const modelSelect = document.getElementById('model-select');
        const kInput = document.getElementById('k-input');
        const statusBadge = document.getElementById('status-badge');

        let abortController = null;
        let currentModel = '';
        let modelsList = [];

        // === Auto-resize textarea ===
        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 120) + 'px';
        });

        // === Load models on start ===
        async function loadModels() {
            try {
                const resp = await fetch('/api/models');
                const data = await resp.json();
                modelsList = data.models || [];
                modelSelect.innerHTML = '';
                modelsList.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.name;
                    opt.textContent = m.name + ' (' + formatSize(m.size) + ')';
                    modelSelect.appendChild(opt);
                });
                if (data.default && modelsList.find(m => m.name === data.default)) {
                    modelSelect.value = data.default;
                } else if (modelsList.length > 0) {
                    modelSelect.value = modelsList[0].name;
                }
                currentModel = modelSelect.value;
                statusBadge.textContent = '✓ ' + modelsList.length + ' моделей';
                statusBadge.className = 'status-badge status-ok';
            } catch (e) {
                statusBadge.textContent = '✗ Ошибка загрузки моделей';
                statusBadge.className = 'status-badge status-error';
            }
        }

        function formatSize(bytes) {
            if (!bytes) return '?';
            const gb = bytes / (1024**3);
            return gb >= 1 ? gb.toFixed(1) + 'GB' : (bytes / (1024**2)).toFixed(0) + 'MB';
        }

        modelSelect.addEventListener('change', () => {
            currentModel = modelSelect.value;
        });

        // === Chat functions ===
        function addMessage(role, content) {
            const emptyState = chat.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const div = document.createElement('div');
            div.className = 'message ' + role;
            div.textContent = content;
            chat.appendChild(div);
            scrollToBottom();
            return div;
        }

        function addSourcesBlock(sources) {
            const emptyState = chat.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const div = document.createElement('div');
            div.className = 'message sources';
            div.innerHTML = '<div style="font-weight:600;margin-bottom:6px;color:var(--orange);">📚 Найденные источники:</div>';
            sources.forEach(s => {
                const item = document.createElement('div');
                item.className = 'source-item';
                const scoreClass = s.score > 0.5 ? 'status-ok' : s.score > 0.2 ? 'status-ok' : 'status-ok';
                item.innerHTML = `
                    <span class="source-score">${s.score.toFixed(3)}</span>
                    <span class="source-name">${escHtml(s.source)}</span>
                    <span style="color:var(--text-dim);font-size:12px;">${escHtml(s.product)}</span>
                `;
                div.appendChild(item);
            });
            chat.appendChild(div);
            scrollToBottom();
        }

        function addThinking() {
            const emptyState = chat.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'thinking-msg';
            div.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            chat.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            chat.scrollTop = chat.scrollHeight;
        }

        function escHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        // === Send question ===
        async function sendQuestion() {
            const question = input.value.trim();
            if (!question) return;

            // Disable UI
            sendBtn.disabled = true;
            sendBtn.style.display = 'none';
            cancelBtn.style.display = 'inline-block';
            cancelBtn.disabled = false;
            input.disabled = true;

            // Add user message
            addMessage('user', question);
            input.value = '';
            input.style.height = 'auto';

            // Add thinking indicator
            const thinkingEl = addThinking();

            const k = parseInt(kInput.value) || 5;

            try {
                abortController = new AbortController();
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        model: currentModel,
                        k: k,
                    }),
                    signal: abortController.signal,
                });

                if (!resp.ok) throw new Error('HTTP ' + resp.status);

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let responseText = '';
                let sourcesReceived = false;

                // Remove thinking indicator
                thinkingEl.remove();

                // Create assistant message
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message assistant';
                chat.appendChild(msgDiv);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        try {
                            const event = JSON.parse(line.slice(6));
                            if (event.type === 'sources' && !sourcesReceived) {
                                sourcesReceived = true;
                                addSourcesBlock(event.data);
                            } else if (event.type === 'token') {
                                responseText += event.data;
                                msgDiv.textContent = responseText;
                                scrollToBottom();
                            } else if (event.type === 'done') {
                                // Metrics received
                                const d = event.data;
                                const tokensPerSec = d.eval_duration > 0 
                                    ? (d.eval_count / (d.eval_duration / 1e9)).toFixed(1) 
                                    : '?';
                                const footer = document.createElement('div');
                                footer.style.cssText = 'font-size:11px;color:var(--text-dim);margin-top:8px;border-top:1px solid var(--border);padding-top:6px;';
                                footer.textContent = `⚡ ${d.eval_count} токенов • ${tokensPerSec} т/с`;
                                msgDiv.appendChild(footer);
                            } else if (event.type === 'error') {
                                responseText += '\n\n[Ошибка: ' + event.data + ']';
                                msgDiv.textContent = responseText;
                                scrollToBottom();
                            }
                        } catch (e) {
                            // ignore parse errors on partial lines
                        }
                    }
                }
            } catch (e) {
                if (e.name === 'AbortError') {
                    addMessage('system', '⏹ Ответ прерван');
                } else {
                    console.error(e);
                    thinkingEl.remove();
                    addMessage('system', '❌ Ошибка: ' + e.message);
                }
            } finally {
                sendBtn.disabled = false;
                sendBtn.style.display = 'inline-block';
                cancelBtn.style.display = 'none';
                input.disabled = false;
                input.focus();
                abortController = null;
            }
        }

        // === Cancel ===
        cancelBtn.addEventListener('click', () => {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
        });

        // === Send on enter (shift+enter = newline) ===
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuestion();
            }
        });

        sendBtn.addEventListener('click', sendQuestion);

        // === Init ===
        loadModels();

        // Auto-refresh models every 30s
        setInterval(loadModels, 30000);
    </script>
</body>
</html>
